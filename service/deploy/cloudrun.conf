# Cloud Run settings for the verify service. It runs code that strangers
# upload, so every setting here leans to the safe side.

SERVICE=polyman-verify
REGION=${GCP_REGION:-us-east1}
REPOSITORY=${GCP_ARTIFACT_REPO:-polyman}
# the runtime identity: a service account with no roles at all
RUNTIME_SA=${GCP_RUNTIME_SERVICE_ACCOUNT:-verify-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com}
# all egress goes into this VPC, which has no NAT and denies egress: no internet
NETWORK=${GCP_VERIFY_NETWORK:-verify-isolated}
SUBNET=${GCP_VERIFY_SUBNET:-verify-isolated}

# One verification per instance (compiling and running solutions needs the
# whole CPU, and it keeps one upload's processes away from another's).
CONCURRENCY=1
CPU=2
MEMORY=2Gi
# a whole contest: up to 26 problems at up to 120 s each fits in the hour
TIMEOUT=3600
MIN_INSTANCES=0
MAX_INSTANCES=3
# gen1 runs the container in gVisor, a stronger sandbox for untrusted code
EXECUTION_ENVIRONMENT=gen1
PROBLEM_TIMEOUT_MS=120000
