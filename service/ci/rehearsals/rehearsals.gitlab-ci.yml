# Nightly incident rehearsal (service/ci/rehearsals/rehearse.sh). Included from
# the root .gitlab-ci.yml.
#
# Every past incident caused by a code change has a folder here with the change
# that caused it. Each night this job re-plants each of those bugs in a
# throwaway copy of main and requires the checks that run before a merge to
# refuse it: the incident's service:test file fails, and the golden public-host
# upload gets the incident's HTTP status. It never pushes or deploys.
#
# Passes only when every bug was re-planted and refused. Fails when a check let
# a past bug through, or when a patch no longer applies (the code moved: a
# maintainer refreshes the patch). The report says which, with a NEXT STEP.
rehearsal:incidents:
  stage: test
  image: node:22
  needs: []
  # the evidence: a check that stopped refusing a past bug turns the night red
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    # the shape of the production hostname, as in service:golden
    PUBLIC_HOST: polyman-verify-1.us-east1.run.app
  script:
    - (cd service && npm ci --no-audit --no-fund --loglevel=error)
    - bash service/ci/rehearsals/rehearse.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths: [rehearsal/]
    reports:
      junit: rehearsal/junit.xml
