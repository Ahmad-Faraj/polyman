# CI for the verify service (#19). Included from the root .gitlab-ci.yml.
#
# On merge requests and on the default branch: test the service, build its
# image, and run the sample problems against that image (the golden check).
# With Google Cloud set up (GCP_PROJECT_ID and friends, see service/README.md),
# merge requests also get a review revision on Cloud Run, and the default
# branch deploys to production, checks it with the same samples and moves
# traffic back if they don't give the expected results.

variables:
  SERVICE_IMAGE: $CI_REGISTRY_IMAGE/verify:$CI_COMMIT_SHORT_SHA

# what the service image is built from: the service itself and polyman
.service:changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &service_files
        - service/**/*
        - src/**/*
        - assets/**/*
        - template/**/*
        - package.json
        - package-lock.json
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *service_files

service:test:
  extends: .service:changes
  stage: test
  image: node:22
  needs: []
  script:
    - cd service
    - npm ci --no-audit --no-fund --loglevel=error
    - npm run typecheck
    - npm test

service:image:
  extends: .service:changes
  stage: build
  image: docker:27.5.1
  services: [docker:27.5.1-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  needs: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f service/Dockerfile --build-arg APP_COMMIT=$CI_COMMIT_SHORT_SHA -t "$SERVICE_IMAGE" .
    - docker push "$SERVICE_IMAGE"

# The image runs as a job service and gets the sample problems, which must give
# their expected results. The same check runs against Cloud Run below.
service:golden:
  extends: .service:changes
  stage: deploy
  image: node:22
  needs: [service:image]
  services:
    - name: $SERVICE_IMAGE
      alias: verify
  script:
    - for i in $(seq 1 30); do curl -sf http://verify:8080/health && break; sleep 2; done
    - node --disable-warning=ExperimentalWarning service/scripts/golden.ts http://verify:8080 --json golden.json
  artifacts:
    when: always
    paths: [golden.json]
    expire_in: 30 days

.service:gcp:
  image: google/cloud-sdk:587.0.0-slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://gitlab.com
  artifacts:
    reports:
      dotenv: deploy.env

service:deploy:review:
  extends: .service:gcp
  stage: deploy
  needs: [service:golden]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GCP_PROJECT_ID
      changes: *service_files
  environment:
    name: verify/review/mr-$CI_MERGE_REQUEST_IID
    url: $SERVICE_URL
  script:
    - sh service/deploy/cloudrun.sh review

service:check:review:
  stage: deploy
  image: node:22
  needs: [service:deploy:review]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GCP_PROJECT_ID
      changes: *service_files
  script:
    - node --disable-warning=ExperimentalWarning service/scripts/golden.ts "$SERVICE_URL" --json golden.json
  artifacts:
    when: always
    paths: [golden.json]

service:deploy:production:
  extends: .service:gcp
  stage: deploy
  needs: [service:golden]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
      changes: *service_files
  resource_group: verify-production
  environment:
    name: verify/production
    url: $SERVICE_URL
  script:
    - sh service/deploy/cloudrun.sh production

service:check:production:
  stage: deploy
  image: node:22
  needs: [service:deploy:production]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
      changes: *service_files
  script:
    - node --disable-warning=ExperimentalWarning service/scripts/golden.ts "$SERVICE_URL" --json golden.json
  artifacts:
    when: always
    paths: [golden.json]

# The samples gave the wrong verdicts in production: send traffic back.
service:rollback:production:
  extends: .service:gcp
  stage: deploy
  needs: [service:deploy:production, service:check:production]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GCP_PROJECT_ID
      changes: *service_files
      when: on_failure
  resource_group: verify-production
  script:
    - sh service/deploy/cloudrun.sh rollback
  artifacts: {}
