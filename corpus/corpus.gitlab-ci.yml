# The corpus: real problems with deliberately wrong solutions, judged by real
# compilers and checkers, compared with pinned true verdicts (corpus/README.md).
# Included from .gitlab-ci.yml. Runs when polyman's code, the corpus or the
# dependencies change, and on every default-branch pipeline.

.corpus:
  extends: .node
  stage: test
  variables:
    # polyman gives each compile 10 s and starts them all at once, so on a
    # 2-vCPU runner sum-parity's 7 compiles wait for a CPU and cross the limit
    # (#88). The verify service already uses 60 s (service/src/verify.ts).
    # Keep this until #88 compiles a few at a time.
    POLYMAN_COMPILE_TIMEOUT_MS: "60000"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes: [src/**/*, corpus/**/*, template/**/*, assets/**/*, package.json, package-lock.json]
  artifacts:
    when: always
    expire_in: 30 days
    paths: [corpus/out/]

# g++, Java and Python reachable as `python`: the toolchain polyman supports.
corpus:
  extends: .corpus
  script:
    - apt-get update -qq && apt-get install -y -qq default-jdk-headless python-is-python3 >/dev/null
    - npm run build
    - node corpus/run.mjs
  # The judge rules as Requirements (Plan > Requirements, #50): each one is
  # marked satisfied or failed from this run. GitLab reads the report from any
  # pipeline, so only the default branch writes one.
  after_script:
    - 'if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then node corpus/requirements.mjs corpus; else echo "Requirements are judged on $CI_DEFAULT_BRANCH only"; fi'
  artifacts:
    # The verdict matrix, linked from the merge request widget.
    expose_as: 'Corpus verdicts'
    paths: [corpus/out/report.html]
    reports:
      junit: corpus/out/junit.xml
      requirements_v2: corpus/out/requirements.json
  # Red on polyman 3.0.0, on every problem, for two known bugs only: `verify
  # --json` reports tests the checker never judged as OK (#21) and presentation
  # errors as WA (#28). Becomes blocking in the MR that fixes them.
  allow_failure: true

# Environments polyman's users have. Each lane pins one fact about them.
corpus:toolchain:
  extends: .corpus
  parallel:
    matrix:
      # The oldest Node polyman supports. This lane found #23 on 20.18 (chalk@5
      # is ESM-only, which `require` loads only from 20.19 on); since !11 the
      # package declares ^20.19.0 || >=22.12.0 and refuses 20.18 with a clear
      # message, so the lane judges the oldest version it promises instead.
      - LANE: node-20.19
        NODE_IMAGE: node:20.19
        PYTHON_ALIAS: 'yes'
      # Stock Debian/Ubuntu: python3 only, no `python` command.
      - LANE: no-python-alias
        NODE_IMAGE: node:22
        PYTHON_ALIAS: 'no'
  image: ${NODE_IMAGE}
  script:
    - apt-get update -qq && apt-get install -y -qq default-jdk-headless >/dev/null
    - if [ "$PYTHON_ALIAS" = "yes" ]; then apt-get install -y -qq python-is-python3 >/dev/null; fi
    - npm run build
    - node dist/cli.js --version
    - node corpus/run.mjs --junit corpus/out/junit-${LANE}.xml
  artifacts:
    reports:
      junit: corpus/out/junit-${LANE}.xml
  allow_failure: true

# The two operating systems polyman's users have besides Linux, on GitLab's
# own macOS and Windows runners. On the default branch they run by themselves;
# in a merge request a person starts them (macOS minutes cost 6x Linux).
.os-lane:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes: [src/**/*, tests/**/*, corpus/**/*, package.json, package-lock.json]
      when: manual
  allow_failure: true
  timeout: 50m

# macOS: the corpus with GNU g++ from Homebrew (Apple clang has no
# <bits/stdc++.h>). On macOS `ulimit -v` fails and the command still runs:
# the spike for #89 found 5/5 problems match with and without it.
corpus:toolchain:macos:
  extends: [.corpus, .os-lane]
  tags: [saas-macos-medium-m1]
  image: macos-15-xcode-16
  script:
    - brew install gcc
    - GXX=$(ls "$(brew --prefix)"/bin/g++-[0-9]* | sort -V | tail -1)
    - mkdir -p "$HOME/gnu" && ln -sf "$GXX" "$HOME/gnu/g++" && export PATH="$HOME/gnu:$PATH"
    - g++ --version | head -1
    - npm run build
    - node dist/cli.js --version
    - node corpus/run.mjs --junit corpus/out/junit-macos.xml
  artifacts:
    when: always
    reports:
      junit: corpus/out/junit-macos.xml

# Windows: the unit tests on Node 22 (the runner's own Node is 21, which
# Vitest can't load). The corpus doesn't run here yet: testlib validators expect
# CR LF on Windows (corpus/README.md). Open on this lane: #94, #95.
toolchain:windows:
  extends: .os-lane
  stage: test
  tags: [saas-windows-medium-amd64]
  variables:
    NODE_ZIP: node-v22.14.0-win-x64
  script:
    - Invoke-WebRequest "https://nodejs.org/dist/v22.14.0/$env:NODE_ZIP.zip" -OutFile node.zip
    - Expand-Archive node.zip -DestinationPath C:\node22
    - $env:Path = "C:\node22\$env:NODE_ZIP;" + $env:Path
    - node --version
    - npm ci --no-audit --no-fund
    - npm run build
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit-windows.xml
  artifacts:
    when: always
    reports:
      junit: junit-windows.xml

# The pinned verdicts judged again without polyman (corpus/truth.mjs): g++,
# javac and Python run every solution and the checker directly. A difference
# means a pinned verdict is wrong (or this runner judges differently), not that
# polyman is; so this job is the check on the corpus itself.
corpus:truth:
  extends: .corpus
  before_script: []
  script:
    - apt-get update -qq && apt-get install -y -qq default-jdk-headless >/dev/null
    - node corpus/truth.mjs --check

# Polygon round trip: push the corpus problems with polyman, read them back from
# Polygon and compare them with their folders (corpus/polygon-roundtrip.mjs).
# Each problem needs a Polygon problem of its own, listed in corpus/polygon.json;
# the others are reported as skipped. Only on the default branch (including
# scheduled pipelines), where the Polygon key is available as a masked,
# protected variable; never on MR branches, which agents write to. One run at a
# time, because every run writes the same problems.
corpus:polygon:
  extends: .node
  stage: test
  resource_group: polygon
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $POLYGON_API_KEY && $POLYGON_API_SECRET
  script:
    - npm run build
    - node corpus/polygon-roundtrip.mjs --all
  # "Generated tests match the platform of record" (#50), from the inputs
  # compared in every round-tripped problem's report
  after_script:
    - node corpus/requirements.mjs polygon
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: corpus/out/junit-polygon*.xml
      requirements_v2: corpus/out/requirements.json
  # Red on polyman 3.0.0 (#24, #25, #26). Becomes blocking once they're fixed.
  allow_failure: true

# Mutation testing of the code that decides verdicts: Stryker plants small bugs
# in src/helpers/solution.ts and counts how many the unit tests catch. The score
# shows in the merge request's metrics widget; the report says which ones live.
corpus:mutation:
  extends: .node
  stage: test
  variables:
    # tests/actions.test.ts sets TZ at runtime, which Stryker's workers don't see
    TZ: Asia/Kolkata
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes: [src/helpers/solution.ts, src/types.d.ts, tests/**/*, corpus/stryker.config.json, corpus/mutation-metrics.mjs, corpus/lib.mjs]
  script:
    # --no-save keeps package.json as it is; --legacy-peer-deps avoids an npm
    # crash (edgesOut) when adding packages without saving them
    - npm i --no-save --legacy-peer-deps --no-audit --no-fund @stryker-mutator/core@9 @stryker-mutator/vitest-runner@9
    - ./node_modules/.bin/stryker run corpus/stryker.config.json
    - node corpus/mutation-metrics.mjs corpus/out/mutation/mutation.json corpus/out/mutation-metrics.txt
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: 'Mutation report'
    paths: [corpus/out/mutation/index.html]
    reports:
      metrics: corpus/out/mutation-metrics.txt

# Who judges the judge: the corpus run against the mutants the unit tests miss
# (corpus/survivors.mjs). Stryker's Survived and NoCoverage mutants are planted
# one at a time, polyman is rebuilt and the corpus judges all problems; a kill
# is any verdict or step that differs from the unmutated build in the same job.
# On the default branch, and on demand in merge requests that change the script
# or the verdict code (play corpus:survivors:mutants). A merge to the default
# branch runs it only when something it reads changed: polyman's source and
# runtime files, the tests Stryker runs, the corpus, the dependencies, the
# TypeScript and Vitest config, or the CI it runs in. Nightly, web and API
# pipelines always run it. A measurement: it never fails the pipeline because
# the judges miss a mutant.
.corpus-survivors:
  extends: .node
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: &survivors-inputs [src/**/*, tests/**/*, corpus/**/*, template/**/*, assets/**/*, package.json, package-lock.json, tsconfig*.json, vitest.config.ts, .gitlab-ci.yml, engine/ci/**/*, service/ci/**/*, infra/infra.gitlab-ci.yml, .gitlab/ci/**/*]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "push"
    - changes: [corpus/survivors.mjs, corpus/lib.mjs, corpus/run.mjs, corpus/stryker.config.json, src/helpers/solution.ts]
  allow_failure: true

# Its own Stryker run, so corpus:mutation keeps its artifacts (and its widget
# link) as they are; the shards need the JSON report of this very commit.
corpus:survivors:mutants:
  extends: .corpus-survivors
  variables:
    TZ: Asia/Kolkata
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes: *survivors-inputs
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "push"
    - changes: [corpus/survivors.mjs, corpus/lib.mjs, corpus/run.mjs, corpus/stryker.config.json, src/helpers/solution.ts]
      when: manual
      allow_failure: true
  script:
    - npm i --no-save --legacy-peer-deps --no-audit --no-fund @stryker-mutator/core@9 @stryker-mutator/vitest-runner@9
    - ./node_modules/.bin/stryker run corpus/stryker.config.json
  artifacts:
    expire_in: 30 days
    paths: [corpus/out/mutation/mutation.json]

corpus:survivors:
  extends: .corpus-survivors
  needs: [corpus:survivors:mutants]
  parallel: 8
  timeout: 90 minutes
  script:
    - apt-get update -qq && apt-get install -y -qq default-jdk-headless python-is-python3 >/dev/null
    - node corpus/survivors.mjs --report corpus/out/mutation/mutation.json --shard "$CI_NODE_INDEX/$CI_NODE_TOTAL"
  artifacts:
    when: always
    expire_in: 30 days
    # per shard: results (shard-*.json), metrics-*.txt; summed by the report job
    paths: [corpus/out/survivors/]
    reports:
      junit: corpus/out/survivors/junit-*.xml

corpus:survivors:report:
  extends: .corpus-survivors
  needs: [corpus:survivors]
  before_script: []
  script:
    - node corpus/survivors.mjs report --shards 8
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: 'Judges vs surviving mutants'
    paths: [corpus/out/survivors/summary.md]
    reports:
      metrics: corpus/out/survivors/metrics.txt

# Production check: the polyman that users install from npm, judged by the same
# corpus and Polygon round trip. Runs from a pipeline schedule (nightly), so a
# release that judges wrongly, or a change on Polygon's side, turns a scheduled
# pipeline red and the incident responder picks it up.
corpus:production:
  extends: .node
  stage: test
  resource_group: polygon
  variables:
    POLYMAN_VERSION: latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - apt-get update -qq && apt-get install -y -qq default-jdk-headless python-is-python3 >/dev/null
    - npm i --prefix /tmp/published --no-audit --no-fund polyman-cli@"$POLYMAN_VERSION"
    - PUBLISHED=/tmp/published/node_modules/polyman-cli/dist/cli.js
    - node "$PUBLISHED" --version
    - status=0
    - node corpus/run.mjs --polyman "$PUBLISHED" --junit corpus/out/junit-production.xml || status=1
    # without credentials the Polygon half would pass unseen: say so and fail
    - 'if [ -n "$POLYGON_API_KEY" ]; then node corpus/polygon-roundtrip.mjs --all --polyman "$PUBLISHED" --junit corpus/out/junit-production-polygon.xml || status=1; else echo "SKIPPED: no Polygon credentials, the round trip did not run"; status=1; fi'
    - exit $status
  artifacts:
    when: always
    expire_in: 90 days
    expose_as: 'Production verdicts'
    paths: [corpus/out/report.html]
    reports:
      junit: corpus/out/junit-production*.xml

# Upstream drift: Polygon's API docs and testlib.h change outside our control.
# Fails, listing the new upstream commits, when either moved since the commit
# pinned in corpus/upstream.json.
corpus:upstream:
  extends: .node
  stage: test
  before_script: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - node corpus/upstream.mjs
