# Shared jobs for the supervised flow. Include it from a project's .gitlab-ci.yml:
#
#   include:
#     - local: engine/ci/autonomy.gitlab-ci.yml
#
# These are the merge request jobs: risk score, guard, flow lint and the
# engine's own tests, plus the go-ahead ledger, which also runs on the default
# branch. The release jobs are in autonomy-release.gitlab-ci.yml.
#
# The project needs to define:
#   - stages: test, assess
#   - merge request pipelines (workflow rules)
#   - a required approval on merge requests (project setting)
#
# The jobs use CI_JOB_TOKEN only. They never write to merge requests: the Duo
# agents do that under their own service accounts, and people approve.
#   - a .autonomy.yml risk policy

.autonomy:node:
  image: node:22
  variables:
    NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [engine/package-lock.json]
      prefix: autonomy-engine
    paths: [.npm/]
  before_script:
    - npm ci --prefix engine --no-audit --no-fund --loglevel=error

# merge requests

autonomy:assess:
  extends: .autonomy:node
  stage: assess
  variables:
    GIT_DEPTH: 0 # needs history to diff against the MR base
  needs:
    - { job: gitlab-advanced-sast, artifacts: true, optional: true }
    - { job: semgrep-sast, artifacts: true, optional: true }
    - { job: secret_detection, artifacts: true, optional: true }
    - { job: gemnasium-dependency_scanning, artifacts: true, optional: true }
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - node engine/src/cli/assess.ts
  artifacts:
    when: always
    expire_in: 30 days
    paths: [risk-report.json]
    reports:
      dotenv: autonomy.env
      metrics: metrics.txt

# Agents are told not to touch the pipeline, the policy or the engine. This
# makes it a rule: an agent commit that changes them fails the pipeline.
autonomy:guard:
  extends: .autonomy:node
  stage: assess
  needs: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - node engine/src/cli/guard.ts

# Assisted (wiki: Assisted): every push an agent makes to an MR needs a
# person's go-ahead first, from someone the risk tier allows (never the
# requester, never an agent). Read from what GitLab recorded (who wrote each
# note, when each push arrived), not from commit dates or trailers, which the
# agent writes itself. The tier comes from autonomy:assess, not from a label.
# The guard's code and its dependencies come from the target branch's head, so an MR
# can't change the check it is checked by. This job's own definition still
# comes from the MR: agents can't change it (governance paths) or merge, and a
# person merges, but a project that can should also require a code owner's
# approval for engine/ and the CI files.
autonomy:goahead:
  extends: .autonomy:node
  stage: assess
  needs:
    - { job: autonomy:assess, artifacts: true }
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    # the target branch as it is now, not where the MR branched off
    - git fetch -q origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/goahead/target"
    - export AUTONOMY_POLICY_REF=$(git rev-parse refs/goahead/target)
    # a fresh directory each run, nothing registered in .git, so a reused checkout reruns cleanly
    - GUARD=$(mktemp -d)
  script:
    # Passing without a guard is allowed only for the MR that adds it. If git
    # fails here, or the guard moved, both checks come out empty and the job fails.
    - |
      if [ -z "$(git ls-tree --name-only "$AUTONOMY_POLICY_REF" -- engine/src/cli/goahead.ts)" ]; then
        if git diff --name-only --diff-filter=A "$AUTONOMY_POLICY_REF...HEAD" -- engine/src/cli/goahead.ts | grep -q .; then
          echo "the target branch has no go-ahead guard yet: this MR adds it, and a person merges it"
          exit 0
        fi
        echo "the target branch has no engine/src/cli/goahead.ts and this MR doesn't add it: can't check go-aheads" >&2
        exit 1
      fi
    - git archive "$AUTONOMY_POLICY_REF" engine | tar -x -C "$GUARD"
    - npm ci --prefix "$GUARD/engine" --no-audit --no-fund --loglevel=error
    - node "$GUARD/engine/src/cli/goahead.ts"

# The same rule on the default branch. This only reports after the fact: until
# main is protected (no direct pushes) and "Pipelines must succeed" is on (#14),
# an agent account can push to main, so do not enable the flows before that.
# Release jobs should need this job.
autonomy:guard:main:
  extends: .autonomy:node
  stage: assess
  needs: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - node engine/src/cli/guard.ts "$CI_COMMIT_BEFORE_SHA"

# The go-ahead ledger (#46): one record per agent push the go-ahead guard
# judged on a merged MR, rebuilt from the GitLab API by the guard's own check
# and chained by SHA-256. Fails if the ledger published on Pages isn't the
# start of the rebuilt one, so no record can change after the fact. The pages
# job copies ledger/ to /ledger/ and only runs when this passed, so a failed
# check publishes nothing and the last good ledger stays up. In merge requests
# it runs when the engine or the pipeline changes.
autonomy:ledger:
  extends: .autonomy:node
  stage: assess
  needs: []
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [engine/**/*, .gitlab-ci.yml]
  script:
    # every MR's last head, so the commits of MRs whose branch is gone are here
    - git fetch -q origin '+refs/merge-requests/*/head:refs/ledger/mr/*'
    - node engine/src/cli/ledger.ts ledger
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: go-ahead ledger
    paths: [ledger/]

# Checks the Duo flow files the way GitLab will when they're saved: its JSON
# schema, its prompt safety rules, and that every prompt variable is an input.
autonomy:flows:
  extends: .autonomy:node
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [.gitlab/duo/flows/**/*]
  script:
    - node engine/src/cli/lint-flows.ts

# The engine's own type check and tests, when it changes.
autonomy:engine:
  extends: .autonomy:node
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [engine/**/*]
  script:
    - npm run typecheck --prefix engine
    - npm test --prefix engine
