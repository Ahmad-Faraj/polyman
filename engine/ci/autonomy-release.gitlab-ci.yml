# Release jobs for the Assisted flow, for projects that deploy. Include it
# next to autonomy.gitlab-ci.yml once the project defines deploy:production
# and monitor:production (which runs engine/src/cli/monitor.ts on the traffic
# it measured), and stages release and verify. It reuses .autonomy:node from
# autonomy.gitlab-ci.yml.

release:check:
  extends: .autonomy:node
  stage: release
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node engine/src/cli/release.ts check
  artifacts:
    reports:
      dotenv: release.env

release:report:
  extends: .autonomy:node
  stage: verify
  needs: [release:check, monitor:production] # health-report.json goes into the release notes
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node engine/src/cli/release.ts report
  artifacts:
    paths: [sci-report.json]
    expire_in: 90 days
