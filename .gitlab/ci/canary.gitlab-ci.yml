# Canary channel: a push to the default branch can publish
# <version>-canary.<pipeline iid> to this project's own npm registry (never to
# npmjs.com), and the package is then judged, installed the way users install
# it, with the corpus. The canary environment records each one. Assisted: the
# publish is a person's go-ahead, a manual job on the merge's pipeline.

.canary:
  extends: .node
  stage: deploy
  variables:
    CANARY_PACKAGE: '@gitlab-ai-hackathon/polyman-cli'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

canary:publish:
  extends: .canary
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: manual
  # Optional, not blocking: a manual job in rules blocks by default, and a
  # pipeline waiting on it shows "blocked" even after another job failed, so a
  # failed production check never made the pipeline "failed" and the incident
  # responder never started (drill, 19 Oct). canary:judge shows as skipped until
  # someone runs this job.
  allow_failure: true
  environment:
    name: canary
    deployment_tier: testing
    url: $CI_PROJECT_URL/-/packages
  script:
    - VERSION="$(node -p "require('./package.json').version")-canary.$CI_PIPELINE_IID"
    - npm pkg set name="$CANARY_PACKAGE" version="$VERSION"
    - npm config set "@gitlab-ai-hackathon:registry" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/"
    - npm config set -- "//$CI_SERVER_HOST/api/v4/projects/$CI_PROJECT_ID/packages/npm/:_authToken" "$CI_JOB_TOKEN"
    # its own dist-tag, so the registry's `latest` never points at a canary
    - npm publish --tag canary
    - echo "CANARY_VERSION=$VERSION" > canary.env
  artifacts:
    reports:
      dotenv: canary.env

# Informational while known judging bugs are open (#21).
canary:judge:
  extends: .canary
  needs: [canary:publish]
  script:
    - apt-get update -qq && apt-get install -y -qq default-jdk-headless python-is-python3 >/dev/null
    - npm config set "@gitlab-ai-hackathon:registry" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/"
    - npm i --prefix /tmp/canary --no-audit --no-fund "$CANARY_PACKAGE@$CANARY_VERSION"
    - node corpus/run.mjs --polyman "/tmp/canary/node_modules/$CANARY_PACKAGE/dist/cli.js" --junit corpus/out/junit-canary.xml
  artifacts:
    when: always
    paths: [corpus/out/report.html]
    reports:
      junit: corpus/out/junit-canary.xml
  allow_failure: true
