# npm release channels (wiki: Release-design): a version bump merged to the
# default branch can go to npm `next`, be judged there as users install it, and
# only then become `latest`. Assisted: publishing and promoting are a person's
# go-ahead, manual jobs on the merge's pipeline. Nothing here runs until a
# person sets NPM_RELEASE=1 and adds NPM_TOKEN (granular, publish rights on
# polyman-cli only, masked, protected, environment scope npm-*). The rules check
# NPM_RELEASE, not the token, so the token can be scoped to the npm-*
# environments: only release:npm-next and release:promote get it.

.npm-release:
  extends: .node
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $NPM_RELEASE == "1"
      changes: [package.json]

# Publishes package.json's version to npm under the `next` tag, with
# provenance: npmjs.com links the package to this pipeline. npm refuses
# provenance when repository.url names another repository (it points at
# GitHub, polyman's home), so the job sets it to this project for the
# published package only; nothing changes in git.
release:npm-next:
  extends: .npm-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $NPM_RELEASE == "1"
      changes: [package.json]
      when: manual
  # blocking on purpose (no allow_failure): a failed publish or promote must
  # stop release:gitlab from tagging. Release pipelines only come from a
  # package.json merge and a person runs them end to end.
  environment:
    name: npm-next
    deployment_tier: staging
    url: https://www.npmjs.com/package/polyman-cli?activeTab=versions
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - VERSION="$(node -p "require('./package.json').version")"
    - |
      if npm view "polyman-cli@$VERSION" version >/dev/null 2>&1; then
        echo "polyman-cli@$VERSION is already on npm: nothing to publish"
        echo "RELEASE_VERSION=none" > release.env
        exit 0
      fi
    - npm run build
    - npm pkg set repository.url="git+$CI_PROJECT_URL.git"
    - npm config set -- "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
    - npm publish --provenance --access public --tag next
    - echo "RELEASE_VERSION=$VERSION" > release.env
  artifacts:
    reports:
      dotenv: release.env

# Judges `next` as users install it, against `latest` on the same machine:
# the gate is no regression (corpus/regressions.mjs), since the corpus can't
# be all green while judge bugs are open. The Polygon round trip on `next` is
# kept as evidence; it gates too once the push bugs (#24, #25, #26) are fixed.
release:next-check:
  extends: .npm-release
  needs: [release:npm-next]
  script:
    - 'if [ "$RELEASE_VERSION" = none ]; then echo "nothing was published"; echo "NEXT STEP: nothing to promote; to release, merge a version bump in package.json first"; exit 0; fi'
    - apt-get update -qq && apt-get install -y -qq default-jdk-headless python-is-python3 >/dev/null
    # npm's CDN can take a moment to serve a new version
    - for i in $(seq 1 30); do npm i --prefix /tmp/next --no-audit --no-fund "polyman-cli@$RELEASE_VERSION" && break; sleep 10; done
    - npm i --prefix /tmp/latest --no-audit --no-fund polyman-cli@latest
    - node corpus/run.mjs --polyman /tmp/latest/node_modules/polyman-cli/dist/cli.js --junit corpus/out/latest/junit.xml || true
    - node corpus/run.mjs --polyman /tmp/next/node_modules/polyman-cli/dist/cli.js --junit corpus/out/next/junit.xml || true
    - 'if [ -n "$POLYGON_API_KEY" ]; then node corpus/polygon-roundtrip.mjs --all --polyman /tmp/next/node_modules/polyman-cli/dist/cli.js --junit corpus/out/next/junit-polygon.xml || echo "the round trip on next failed: see its report (evidence, not yet a gate)"; fi'
    - node corpus/regressions.mjs corpus/out/latest/summary.json corpus/out/next/summary.json
    # reached only when next has no regression against latest
    - 'echo "NEXT STEP: polyman-cli@$RELEASE_VERSION on next judges as well as latest or better. @$GITLAB_USER_LOGIN (who merged the version bump) or another maintainer runs release:promote in this pipeline to make it latest: $CI_PIPELINE_URL"'
  artifacts:
    when: always
    expire_in: 1 year
    expose_as: 'Release check next vs latest'
    paths: [corpus/out/]
    reports:
      junit: corpus/out/next/junit*.xml

# Moves `latest` to the judged version. Offered only after the check passed.
release:promote:
  extends: .npm-release
  needs: [release:npm-next, release:next-check]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $NPM_RELEASE == "1"
      changes: [package.json]
      when: manual
  # blocking on purpose (no allow_failure): a failed publish or promote must
  # stop release:gitlab from tagging. Release pipelines only come from a
  # package.json merge and a person runs them end to end.
  environment:
    name: npm-latest
    deployment_tier: production
    url: https://www.npmjs.com/package/polyman-cli
  script:
    - 'if [ "$RELEASE_VERSION" = none ]; then echo "nothing was published"; echo "NEXT STEP: nothing to promote; to release, merge a version bump in package.json first"; exit 0; fi'
    - npm config set -- "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
    - npm dist-tag add "polyman-cli@$RELEASE_VERSION" latest

# The evidence a judge needs to see why a version was allowed out (#35), kept
# with the Release: job artifacts expire, so each file goes to this project's
# generic package registry (polyman-cli-evidence/VERSION) and the Release links
# it. Runs once a person promoted the version, so nothing is kept for a version
# that never became latest.
#   - corpus verdicts on next and on the latest it replaced (release:next-check)
#   - the Polygon round trip on next, when the Polygon key was there
#   - the mutation report of this pipeline (corpus:mutation)
#   - a CycloneDX SBOM of the published package's dependencies
#   - npm's provenance attestation and its Sigstore transparency log entry
release:evidence:
  extends: .npm-release
  needs:
    - release:npm-next
    - { job: release:next-check, artifacts: true }
    - release:promote
    - { job: corpus:mutation, artifacts: true, optional: true }
  # Best effort: latest has already moved, so a failed evidence step must not
  # stop the GitLab Release. release:gitlab still runs and links what was kept.
  allow_failure: true
  variables:
    EVIDENCE_PACKAGE: polyman-cli-evidence
  script:
    # this job only needs CI_JOB_TOKEN; keep the publish token away from npx
    # (a job-level variable can't override a project variable, so unset it)
    - unset NPM_TOKEN
    - rm -f release-links.jsonl && touch release-links.jsonl
    - 'if [ "$RELEASE_VERSION" = none ]; then echo "nothing was published"; echo "NEXT STEP: nothing to promote; to release, merge a version bump in package.json first"; exit 0; fi'
    - mkdir -p evidence
    - cp corpus/out/next/report.html evidence/corpus-verdicts-next.html
    - cp corpus/out/latest/report.html evidence/corpus-verdicts-latest.html || true
    # one report per round-tripped problem (polygon-roundtrip.mjs --all), and the skipped ones
    - 'for f in corpus/out/next/junit-polygon-*.xml; do [ -e "$f" ] || { echo "no Polygon round trip on next (no Polygon key in this pipeline)"; break; }; cp "$f" "evidence/polygon-roundtrip-next-${f##*/junit-polygon-}"; done'
    - cp corpus/out/mutation/index.html evidence/mutation-report.html || echo "no mutation report in this pipeline"
    - npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file evidence/sbom.cdx.json
    # what npm recorded when release:npm-next published with --provenance
    - curl -sSf "https://registry.npmjs.org/-/npm/v1/attestations/polyman-cli@$RELEASE_VERSION" -o evidence/npm-attestations.json || { rm -f evidence/npm-attestations.json; echo "npm has no attestations for polyman-cli@$RELEASE_VERSION"; }
    - |
      link() { printf '{"name":"%s","url":"%s","link_type":"%s"}\n' "$1" "$2" "$3" >> release-links.jsonl; }
      base="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$EVIDENCE_PACKAGE/$RELEASE_VERSION"
      for f in evidence/*; do
        name="$(basename "$f")"
        curl -sSf --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$base/$name" > /dev/null
        echo "kept $name"
      done
      label() {
        case "$1" in
          corpus-verdicts-next.html) echo "Corpus verdicts: polyman-cli@$RELEASE_VERSION" ;;
          corpus-verdicts-latest.html) echo "Corpus verdicts: the latest it replaced" ;;
          polygon-roundtrip-next.xml) echo "Polygon round trip (JUnit)" ;;
          mutation-report.html) echo "Mutation report (src/helpers/solution.ts)" ;;
          sbom.cdx.json) echo "SBOM (CycloneDX)" ;;
          npm-attestations.json) echo "npm provenance attestation" ;;
          *) echo "$1" ;;
        esac
      }
      for f in evidence/*; do name="$(basename "$f")"; link "$(label "$name")" "$base/$name" package; done
      link "npm provenance: polyman-cli@$RELEASE_VERSION" "https://www.npmjs.com/package/polyman-cli/v/$RELEASE_VERSION#provenance" other
    - |
      LOG_INDEX="$(node -e 'try { const a = require("./evidence/npm-attestations.json").attestations.find(x => /provenance/.test(x.predicateType)); console.log(a.bundle.verificationMaterial.tlogEntries[0].logIndex) } catch {}')"
      if [ -n "$LOG_INDEX" ]; then printf '{"name":"%s","url":"%s","link_type":"other"}\n' "Sigstore transparency log entry $LOG_INDEX" "https://search.sigstore.dev/?logIndex=$LOG_INDEX" >> release-links.jsonl; fi
    - cat release-links.jsonl
  artifacts:
    when: always
    expire_in: 1 year
    paths: [evidence/, release-links.jsonl]

# The GitLab Release vX: the tag, links to the npm package and to the check
# that judged it, the evidence above, and the release evidence GitLab collects.
release:gitlab:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [release:npm-next, release:next-check, release:promote, { job: release:evidence, artifacts: true }]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $NPM_RELEASE == "1"
      changes: [package.json]
  script:
    - 'if [ "$RELEASE_VERSION" = none ]; then echo "nothing was published"; echo "NEXT STEP: nothing to promote; to release, merge a version bump in package.json first"; exit 0; fi'
    # one --assets-link per evidence file release:evidence kept
    - |
      touch release-links.jsonl
      set --
      while IFS= read -r l; do [ -n "$l" ] && set -- "$@" --assets-link "$l"; done < release-links.jsonl
      release-cli create --name "polyman-cli $RELEASE_VERSION" --tag-name "v$RELEASE_VERSION" --ref "$CI_COMMIT_SHA" \
        --description "Published to npm from pipeline $CI_PIPELINE_URL with provenance, judged against the previous latest before promotion. The links below are the evidence it was judged on." \
        --assets-link "{\"name\":\"npm: polyman-cli@$RELEASE_VERSION\",\"url\":\"https://www.npmjs.com/package/polyman-cli/v/$RELEASE_VERSION\"}" \
        --assets-link "{\"name\":\"Release check: next vs latest\",\"url\":\"$CI_PIPELINE_URL\"}" \
        "$@"
