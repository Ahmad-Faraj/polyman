# GitLab Insights (Analyze > Insights): what the judges found and how the work
# moved, week by week. GitLab reads this file from the default branch only.
# Schema: https://docs.gitlab.com/user/project/insights/
# Every label named here exists in the project.
judges:
  title: "What the judges found"
  charts:
    - title: "Issues per judge"
      description: "Issues opened per week, open and closed, by the judge that found them (found-by::*). Issues without one of these labels count as undefined: select it in the legend to hide it."
      type: stacked-bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: all
          collection_labels:
            - "found-by::corpus"
            - "found-by::polygon"
            - "found-by::mutation"
            - "found-by::audit"
            - "found-by::review"
          group_by: week
          period_limit: 12
    - title: "Issues per bug class"
      description: "Issues opened per week, by bug class: judge-lies (a wrong verdict), environment-drift (correct problems fail on users' machines), platform-sync (what polyman sends isn't what Polygon gets). Issues without one of these labels count as undefined."
      type: stacked-bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: all
          collection_labels:
            - "class::judge-lies"
            - "class::environment-drift"
            - "class::platform-sync"
          group_by: week
          period_limit: 12

delivery:
  title: "Incidents and merges"
  charts:
    - title: "Incidents per week"
      description: "Issues and incidents with the incident label, opened per week, open and closed. Fire drills count too (they also carry the drill label); an incident without the label does not."
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: issue
          issuable_state: all
          filter_labels:
            - incident
          group_by: week
          period_limit: 12
    - title: "Merged merge requests per week"
      description: "Merge requests per week of their merge, among those opened in the last 12 weeks."
      type: bar
      query:
        data_source: issuables
        params:
          issuable_type: merge_request
          issuable_state: merged
          group_by: week
          period_limit: 12
