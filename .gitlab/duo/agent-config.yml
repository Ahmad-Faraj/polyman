# How the Duo flows run for this project. Only the copy on the default branch
# is used. The full node image has g++ and python3, which polyman's tests and
# `polyman verify` need; switch to the toolchain image from #16 once it exists.
image: node:22

setup_script:
  - npm ci --cache .npm --no-audit --no-fund --loglevel=error
  - npm ci --prefix engine --cache .npm --no-audit --no-fund --loglevel=error

cache:
  key:
    files:
      - package-lock.json
      - engine/package-lock.json
    prefix: duo-flows
  paths:
    - .npm/

network_policy:
  include_recommended_allowed: true
  allowed_domains:
    - registry.npmjs.org
    # `polyman download-testlib` fetches testlib.h from here
    - raw.githubusercontent.com
