name: agent review footprint
description: "One merge request review by our Duo flows: runner time (measured)
  and model calls (bounded from the session log), turned into gCO2e. Energy per
  model call is a cited range (0.24-2.5 Wh), not a measurement; see
  SUSTAINABILITY.md."
tags:
  kind: agents
aggregation:
  metrics:
    - carbon-low
    - carbon-high
  type: horizontal
initialize:
  plugins:
    runner-energy:
      method: Multiply
      path: builtin
      config:
        input-parameters:
          - runner-hours
          - runner-kw
        output-parameter: runner-energy
    runner-carbon:
      method: Multiply
      path: builtin
      config:
        input-parameters:
          - runner-energy
          - grid-g-per-kwh
        output-parameter: runner-carbon
    runner-embodied:
      method: Multiply
      path: builtin
      config:
        input-parameters:
          - runner-hours
          - embodied-g-per-hour
        output-parameter: runner-embodied
    model-energy-low:
      method: Multiply
      path: builtin
      config:
        input-parameters:
          - model-calls-low
          - kwh-per-call-low
        output-parameter: model-energy-low
    model-energy-high:
      method: Multiply
      path: builtin
      config:
        input-parameters:
          - model-calls-high
          - kwh-per-call-high
        output-parameter: model-energy-high
    model-carbon-low:
      method: Multiply
      path: builtin
      config:
        input-parameters:
          - model-energy-low
          - grid-g-per-kwh
        output-parameter: model-carbon-low
    model-carbon-high:
      method: Multiply
      path: builtin
      config:
        input-parameters:
          - model-energy-high
          - grid-g-per-kwh
        output-parameter: model-carbon-high
    carbon-low:
      method: Sum
      path: builtin
      config:
        input-parameters:
          - runner-carbon
          - runner-embodied
          - model-carbon-low
        output-parameter: carbon-low
      parameter-metadata:
        outputs:
          carbon-low:
            unit: gCO2e
            description: carbon-low for one review
            aggregation-method:
              time: sum
              component: sum
    carbon-high:
      method: Sum
      path: builtin
      config:
        input-parameters:
          - runner-carbon
          - runner-embodied
          - model-carbon-high
        output-parameter: carbon-high
      parameter-metadata:
        outputs:
          carbon-high:
            unit: gCO2e
            description: carbon-high for one review
            aggregation-method:
              time: sum
              component: sum
