# GitLab CI for polyman. Mirrors .github/workflows/ci.yml + deploy-docs.yaml.
stages:
  - check
  - test
  - build
  - deploy

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# Shared Node setup, kept out of `default:` so it doesn't leak into the scanner jobs.
.node:
  image: node:20
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

format:
  extends: .node
  stage: check
  script: npm run format:check

lint:
  extends: .node
  stage: check
  script: npm run lint

test:
  extends: .node
  stage: test
  # Full node images include g++ and python3, so the g++ integration tests run here.
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ['20', '22']
  script:
    - >
      npx vitest run --coverage
      --coverage.reporter=text --coverage.reporter=cobertura
      --reporter=default --reporter=junit --outputFile.junit=junit.xml
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  extends: .node
  stage: build
  script: npm run build
  artifacts:
    paths: [dist/]
    expire_in: 7 days

# API docs (TypeDoc) → GitLab Pages. typedoc.json still writes to docs/; Pages serves public/.
pages:
  extends: .node
  stage: deploy
  script:
    - npm run docs
    - mv docs public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
