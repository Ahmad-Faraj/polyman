# GitLab CI for polyman: the jobs from .github/workflows/ci.yml and deploy-docs.yaml,
# plus the verify service (service/ci), which has no GitHub counterpart.
stages:
  - check
  - test
  - assess
  - build
  - deploy

# Merge request pipelines while an MR is open, branch pipelines otherwise, so a
# push doesn't run everything twice.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # run the scanners in merge request pipelines too; the risk score reads them
  AST_ENABLE_MR_PIPELINES: "true"

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  # risk score, guard and flow checks on merge requests (engine/README.md)
  - local: engine/ci/autonomy.gitlab-ci.yml
  # the verify web service (#19): its tests, image, sample check and Cloud Run deploy
  - local: service/ci/service.gitlab-ci.yml

# Shared Node setup, kept out of `default:` so it doesn't leak into the scanner jobs.
.node:
  image: node:20
  interruptible: true
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

format:
  extends: .node
  stage: check
  script: npm run format:check

lint:
  extends: .node
  stage: check
  script: npm run lint

test:
  extends: .node
  stage: test
  # Full node images include g++ and python3, so the g++ integration tests run here.
  image: node:${NODE_VERSION}
  parallel:
    matrix:
      - NODE_VERSION: ['20', '22']
  script:
    - >
      npx vitest run --coverage
      --coverage.reporter=text --coverage.reporter=cobertura
      --reporter=default --reporter=junit --outputFile.junit=junit.xml
  coverage: '/All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

build:
  extends: .node
  stage: build
  script: npm run build
  artifacts:
    paths: [dist/]
    expire_in: 7 days

# API docs (TypeDoc) → GitLab Pages. typedoc.json still writes to docs/; Pages serves public/.
pages:
  extends: .node
  stage: deploy
  script:
    - npm run docs
    - mv docs public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
