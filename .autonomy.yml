# Risk policy for polyman.
# Every MR needs one approval. The score from these rules decides how much
# review the agents do before that approval is asked for.

thresholds:
  # below medium: GitLab's Code Review (GitLabDuo as reviewer), and a summary from the lead reviewer
  medium: 25   # code and test reviewers
  high: 60     # security, code and test reviewers

paths:
  critical:        # Polygon credentials and network, files written from remote data, verdicts
    - src/polygon.ts
    - src/helpers/remote/**
    - src/helpers/checker.ts
    - src/helpers/validator.ts
    - assets/checkers/**
    # the verify service runs strangers' code: its sandbox, upload handling and deploy
    - service/src/unzip.ts
    - service/src/kill-tree.ts
    - service/src/problems.ts
    - service/src/verify.ts
    - service/Dockerfile
    - service/deploy/**
  high:            # running user code, limits, caching of binaries, the verify pipeline
    - src/executor.ts
    - src/helpers/shell.ts
    - src/helpers/solution.ts
    - src/helpers/compile-cache.ts
    - src/helpers/prebuilt-testlib.ts
    - src/helpers/generator.ts
    - src/helpers/testset.ts
    - src/steps.ts
    - src/actions.ts
    - service/src/**
  medium:
    - src/**
    - template/**
  low:
    - "**/*.md"
    - docs/**

governance:        # the automation itself (defaults are always included)
  - engine/**
  - corpus/**        # the problems and true verdicts polyman is judged by
  - service/samples/**          # the verify service's golden problems and expected results
  - service/scripts/golden.ts   # the check that compares them
  - service/ci/**               # the pipeline that gates the service's deploy on it
  - infra/**                    # the sandbox's Google Cloud setup and the policy that judges it

source:
  - src/**
tests:
  - tests/**
  - "**/*.test.ts"

incidents_file: .autonomy/incidents.json

# What the Duo flows need to know about this project. `node engine/src/cli/sync-flows.ts`
# fills these into the flows when it publishes them.
agents:
  about: >
    polyman, a TypeScript (Node 20+) CLI for Codeforces problem setters: it
    creates, verifies and syncs competitive programming problems with Polygon.
    Read CLAUDE.md before changing anything: it explains the layout (actions,
    steps, helpers, executor), the solution-tag verdicts and the conventions.
  checks: npm ci && npm run lint && npm run format:check && npx vitest run && npm run build
  security_focus: >
    files written from names Polygon returns (path traversal, see #2); the
    Polygon API key and secret (never logged, printed or sent anywhere but
    Polygon); running user code (time and memory limits, no shell injection
    through file names or arguments); and verdicts, since a checker or
    validator change must never let a wrong solution pass.
  test_guide: Tests use vitest and live in tests/, mirroring src/. Tests that compile C++ need g++.
  # service accounts GitLab creates when the flows are enabled here; fill in
  # once they exist (node engine/src/cli/doctor.ts checks them)
  reviewer_account: ai-mr-reviewer-gitlab-ai-hackathon_e50080
  fixer_account: ai-pipeline-fixer-gitlab-ai-hackathon_b1d814

monitor:
  # the verify service routes service/scripts/golden.ts sends requests to in
  # service:check:production; it writes their numbers to traffic.json and the
  # monitor checks the review's watch list against them. Named as the reviewer
  # must name them: method and the route as service/src/app.ts declares it.
  measured_routes: ["GET /api/samples", "POST /api/samples/:name/verify", "POST /api/verify"]
  # failing one of these means production is affected (the incident responder
  # opens an incident). Only jobs that run once production serves the new
  # release: a failed candidate deploy or check never got traffic, so those
  # are ordinary bugs. A promote superseded by a newer service change ends
  # without a switch and does not fail.
  production_jobs:
    - service:check:production
    - service:rollback:production
  # moves traffic back, but only when production serves this pipeline's release
  rollback_job: service:rollback:production

# Assisted (wiki: Assisted): who may give an agent the go-ahead for its next
# step. The requester (the issue's or MR's author), agents, GitLabDuo and
# anyone outside go_ahead.people never count. By risk tier, "anyone" means any other person and "maintainers" only
# the people below; rollbacks always need a maintainer. The autonomy:goahead job
# enforces this on every MR pipeline.
go_ahead:
  # the people on the project: anyone else (a new bot, a stranger on this
  # public project) needs a go-ahead to push and can't give one
  people:
    - HamzaHassanain
    - Ahmad-Faraj
    - Mazen-Ghanaym
  # all three, so high-risk work never waits on one person. The requester
  # still never counts, so every high-risk step needs one of the other two.
  maintainers:
    - HamzaHassanain
    - Mazen-Ghanaym
    - Ahmad-Faraj
  low: anyone
  medium: anyone
  high: maintainers

# Used to estimate the carbon cost of each change (SCI). Defaults match a
# GitLab.com small Linux runner (2 vCPU, 8 GB) in GCP us-east1, with Cloud
# Carbon Footprint coefficients. Change them if your runners differ.
sustainability:
  vcpus: 2
  memory_gb: 8
  utilization: 0.5
  pue: 1.1
  # us-east1's grid in 2025 (Google, region-carbon-info data/yearly/2025.csv:
  # 579.44 gCO2e/kWh; it was 560 in the 2023 data)
  grid_gco2e_per_kwh: 579
