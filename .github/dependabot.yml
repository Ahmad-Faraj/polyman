# Known advisories and updates for the npm dependencies and the actions the
# workflows use. Replaces GitLab Dependency Scanning. Each update is its own
# pull request, so no dependency moves as a side effect of other work.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
